					sql_result_free("ra");
					send_reply("403", "Forbidden");
					exit;
				}
			}
		}
		
		if ($xavp(ra[0]=>dtype) == 'u'){		
			if (!proxy_authorize("$fd", "customer_devices")) {
				proxy_challenge("$fd", "1"); 				
				exit;			
			};
		};
		ds_select_dst("2", "4");		
		msg_apply_changes();
		xlog("L_ALERT","!!!!!!!!dst list $du $ru $avp(dscnt)  dst_avp($avp(dsdst)) dst_avp($(avp(dsdst)[0]))  $avp(dsdst) $(avp(dsdst)[0]) $(avp(dsdst)[1]) $(avp(dsdst)[2])\n");
		if($(var(ACCOUNTCODE){s.len}) > 1 ){
			route(CPSSET);
		}
		route(RELAY);		
		exit;
	}
	
 
	else if ($xavp(ra[0]=>account_id) != $null && $xavp(ra[0]=>account_id) != '' && $xavp(ra[0]=>ipauthfrom) ==  "NO"){
	 	xlog("L_ALERT","DDDDDDDDDDDDD Registrar User name $fU  $xavp(ra[0]=>ipaddress) $xavp(ra[0]=>ipauthfrom) $fd $var(host)\n");				
		if (!proxy_authorize("$fd", "customer_devices")) {
			proxy_challenge("$fd", "1"); 				
			exit;			
		};

		ds_select_dst("2", "4");		
		msg_apply_changes();
		xlog("L_ALERT","!!!!!!!!dst list $du $ru $avp(dscnt)  dst_avp($avp(dsdst)) dst_avp($(avp(dsdst)[0]))  $avp(dsdst) $(avp(dsdst)[0]) $(avp(dsdst)[1]) $(avp(dsdst)[2])\n");
		if($(var(ACCOUNTCODE){s.len}) > 1 ){
			route(CPSSET);
		}
		route(RELAY);		
		exit;
	}

xlog("L_ALERT","222222DDDDDDDDDDDDD Registrar User name $fU  $xavp(ra[0]=>ipaddress) $xavp(ra[0]=>ipauthfrom) $fd $var(host)\n");
	return;	
}

 
# IP authorization and user authentication
route[AUTH] {
	if(ds_is_from_list("5")){	
		return 1;
	}
	#!ifdef WITH_FREESWITCH
	if(route(FROMFREESWITCH)){	
		return 1;
	}
	#!endif
#!ifdef WITH_AUTH

	sql_query("ca","select ipaddress, ipauthfrom, FIND_IN_SET('$si',ipaddress) state, account_id  from customer_ips where ipaddress = '$si' ;", "ra");
	if($dbr(ra=>rows)>0) {		
		if ($xavp(ra=>state) =='1'  && $xavp(ra=>ipauthfrom) == 'SRC'){
			xlog("L_ALERT", "IP Auth available allowed.\n");
			return;
		}
	}
 


	#if (is_method("REGISTER") || from_uri==myself) {
	if (is_method("REGISTER") ) {
	
		xlog("L_ALERT","REGISTER - d[$mi] m[$rm] r[0] [$fu -> $ru ($tu)]: User $fu src_ip $si\n");
		sql_query("ca","select ipaddress, ipauthfrom, FIND_IN_SET('$si',ipaddress) state,  FIND_IN_SET('$fd',ipaddress) state2,  account_id from customer_devices where  username ='$fU';", "ra");
		xlog("L_ALERT","select ipaddress, ipauthfrom, FIND_IN_SET('$si',ipaddress) state,  FIND_IN_SET('$fd',ipaddress) state2,  account_id from customer_devices where  username ='$fU';\n");
		if($dbr(ra=>rows)>0) {
			xlog("L_ALERT","Checking IP restrictions for $si IP of $fU user for REGISTER request.\n");
			 
			if ($xavp(ra=>state) =='0'  && $xavp(ra=>ipauthfrom) == 'SRC'){
				xlog("L_ALERT", "User $fU source IP $si not allowed.\n");
				sl_send_reply("403","Fobidden Auth ID");
				exit;
			} 
			
			else if ($xavp(ra=>state2) =='0'  && $xavp(ra=>ipauthfrom) == 'FROM'){
				xlog("L_ALERT", "User $fU source IP $si not allowed.\n");
				sl_send_reply("403","Fobidden Auth ID");
				exit;
			} else {
				xlog("L_ALERT", "Trying to Authorize SIP User $fU (digest Auth) \n");
				$var(ACCOUNTCODE) = $xavp(ra=>account_id);
				route(AUTH2);
			}
		} else {
			xlog("L_ALERT", "User $fU IP auth is not active SWITCH \n");
			$var(ACCOUNTCODE) = $xavp(ra=>account_id);
			route(AUTH2);
		}
		sql_result_free("ra");
		
		
		
	
		# user authenticated - remove auth header
		if(!is_method("REGISTER|PUBLISH"))
			consume_credentials();
	}
	# if caller is not local subscriber, then check if it calls
	# a local destination, otherwise deny, not an open relay here
	if (from_uri!=myself && uri!=myself) {
		sl_send_reply("403", "Not relaying");
		exit;
	}

#!else

	# authentication not enabled - do not relay at all to foreign networks
	if(uri!=myself) {
		sl_send_reply("403", "Not relaying");
		exit;
	}

#!endif
	return;
} 
route[AUTH2] {
	#!ifdef WITH_AUTH
	if (is_method("REGISTER") || from_uri==myself){
		#!ifdef WITH_HTABLE
			if($sht(a=>$au::auth_count)==5){
				$var(exp) = $Ts - 900;
				if($sht(a=>$au::last_auth) > $var(exp)) {
					sl_send_reply("403", "Try later");
					exit;
				} else {
					$sht(a=>$au::auth_count) = 0;
				}
			}
		#!endif
			# authenticate requests

			if (!auth_check("$fd", "customer_devices", "1")) {
				switch ($retcode) {
					case -1:
						sl_send_reply("403", "Forbidden");
						exit;
					case -2:
					#!ifdef WITH_HTABLE
						if($sht(a=>$au::auth_count) == $null)
							$sht(a=>$au::auth_count) = 0;
						$sht(a=>$au::auth_count) = $sht(a=>$au::auth_count) + 1;
						if($sht(a=>$au::auth_count) == 5)
							xlog("L_ALERT","Auth failed 5th time - src ip: $si\n");
						$sht(a=>$au::last_auth) = $Ts;
					#!endif
						break;
				}
				auth_challenge("$fd", "0");
				exit;
			}
			#!ifdef WITH_HTABLE
			$sht(a=>$au::auth_count) = 0;
			#!endif
			# user authenticated - remove auth header
			if(!is_method("REGISTER|PUBLISH")){
				consume_credentials();
			}
		}
		if (from_uri!=myself && uri!=myself) {
			sl_send_reply("403","Fobidden Auth ID");
			exit;
		}
	#!endif
	return;
}
# Caller NAT detection
route[NATDETECT] {
#!ifdef WITH_NAT
	if (nat_uac_test("19")) {
		if (is_method("REGISTER")) {
			fix_nated_register();
		} else {
			if(is_first_hop()) {
				set_contact_alias();
			}else{
				fix_nated_contact();
			}
		}
		setflag(FLT_NATS);
	}
#!endif
	return;
}
# RTP relaying management and signaling updates for NAT traversal
route[NATMANAGE] {
#!ifdef WITH_NAT
	if (is_request()) {
		if(has_totag()) {
			if(check_route_param("nat=yes")) {
				setbflag(FLB_NATB);
			}
		}
	}
	if(get_profile_size("calls","$ci","$avp(size)")){
		xlog("L_ALERT","currently there are $avp(size) Media Enabled\n");
		if($avp(size) > 0){
			setbflag(FLB_NATB);
		}
	}	
	if (!(isflagset(FLT_NATS) || isbflagset(FLB_NATB))) 
		return;

#!ifdef WITH_RTPENGINE
	if(nat_uac_test("8")) {
		rtpengine_manage("SIP-source-address replace-origin replace-session-connection");
	} else {
		rtpengine_manage("replace-origin replace-session-connection");
	}
#!else
	if(nat_uac_test("8")) {
		rtpproxy_manage("co");
	} else {
		rtpproxy_manage("cor");
	}
#!endif
	set_dlg_profile("calls","$ci");	
	if (is_request()) {
		if (!has_totag()) {
			if(t_is_branch_route()) {
				add_rr_param(";nat=yes");
			}
		}
	}
	if (is_reply()) {
		if(isbflagset(FLB_NATB)) {
			if(is_first_hop()){
				set_contact_alias();
			}else{
				fix_nated_contact();
			}
		}
	}

	if(isbflagset(FLB_NATB)) {
		# no connect message in a dialog involving NAT traversal
		if (is_request()) {
			if(has_totag()) {
				set_forward_no_connect();
			}
		}
	}
#!endif
	return;
}

