/* Main SIP request routing logic
 * - processing of any incoming SIP request starts with this route
 * - note: this is the same as route { ... } */
request_route {
	$var(Identity)  = $hdr(Identity);

	xlog("L_ALERT"," -------------------------------- New Call --------------------------------------- $rm \n");
	if ( is_method("OPTIONS") ) {
		if($fU=='sipsak'){
			sl_send_reply("500", "Server Dead");
			exit;
		}
	}

	if ( is_method("INFO") ) {
		sl_send_reply("200", "OK");
                exit;
	}

	# per request initial checks
	route(REQINIT);

	# NAT detection
	route(NATDETECT);
 

	### only initial requests (no To tag)
	# CANCEL processing
	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}

	# handle retransmissions
	if (!is_method("ACK")) {
		if(t_precheck_trans()) {
			t_check_trans();
			exit;
		}
		t_check_trans();
	}
	# handle requests within SIP dialogs
	route(WITHINDLG);

	### only initial requests (no To tag)

	# authentication
	route(AUTH);

	# record routing for dialog forming requests (in case they are routed)
	# - remove preloaded route headers
	remove_hf("Route");
	if (is_method("INVITE|SUBSCRIBE")) {
		record_route();
	}

	# account only INVITEs
	if (is_method("INVITE")) {
		setflag(FLT_ACC); # do accounting
	}

 

	### requests for my local domains

	# handle presence related requests
	route(PRESENCE);

	# handle registrations
	route(REGISTRAR);

	if ($rU==$null) {
		# request with no Username in RURI
		sl_send_reply("484", "Address Incomplete");
		exit;
	}

	#DID provider list
	route(DIDPROVIDER);
	# dispatch destinations to PSTN
	route(PSTN);

	# user location service
	route(LOCATION);
	return;
}

# Wrapper for relaying requests
route[DIDPROVIDER]{
	if (is_method("REGISTER")){
		return;
	}

	if(ds_is_from_list("2")){
		return 1;
	}

	if(!is_method("INVITE")){
		return;
	}

	$var(x)  = $tU;
	if($(var(x){s.substr,0,1})  ==  '+'){
		$tU = $(var(x){s.substr,1,0});
	}

 	$var(x)  = $rU;
        if($(var(x){s.substr,0,1})  ==  '+'){
                $rU = $(var(x){s.substr,1,0});
        } 
	sql_xquery("ca","select  LENGTH(remove_string)  rmlenth, LENGTH(maching_string) lndata, remove_string, add_string ,    REPLACE( concat(if(add_string = '%', '',add_string) ,TRIM(LEADING remove_string FROM  TRIM(LEADING '+' FROM '$rU'))), '%','') finalrui  from carrier_prefix INNER JOIN carrier_ips on carrier_ips.carrier_id = carrier_prefix.carrier_id  where  carrier_prefix.route = 'INBOUND' and  '$rU'  like maching_string and ipaddress =  '$si'  order by lndata desc limit 1;", "ruinew");
	xlog("L_ALERT"," select   LENGTH(remove_string)  rmlenth, LENGTH(maching_string) lndata, remove_string, add_string ,  REPLACE( concat(if(add_string = '%', '',add_string) ,TRIM(LEADING remove_string FROM  TRIM(LEADING '+' FROM '$rU'))), '%','') finalrui  from carrier_prefix INNER JOIN carrier_ips on carrier_ips.carrier_id = carrier_prefix.carrier_id  where  carrier_prefix.route = 'INBOUND' and  '$rU'  like maching_string and ipaddress =  '$si'  order by lndata desc limit 1;  \n");
	if($xavp(ruinew[0]=>finalrui) != $null && $xavp(ruinew[0]=>finalrui) != '' ){	
		$rU =$xavp(ruinew[0]=>finalrui);
		#$tU =$xavp(ruinew[0]=>finalrui);
		#$tU =$rU;
		xlog("L_ALERT","######################## rU $rU");
		xlog("L_ALERT","######################## tU $tU");
		xlog("L_INFO","Blocking scanners and pushing IPs to iptables");
		xlog("L_INFO","Blocking scanners and pushing IPs to iptables");
		xlog("L_INFO","Blocking scanners and pushing IPs to iptables");
		$var(count) = 0;
		#Check list of valid IPS from SIP trunk
		sql_xquery("ca","SELECT did.account_id, carrier.carrier_id, carrier.carrier_status, '1' AS gateway_withmedia, carrier_ips.carrier_ip_id AS enddevice_id, carrier.carrier_cps AS enddevice_cps, carrier.carrier_cc AS enddevice_cc, carrier_ips.carrier_ip_id, carrier.carrier_cps, carrier.carrier_cc from carrier INNER JOIN carrier_ips on carrier_ips.carrier_id = carrier.carrier_id  INNER JOIN did on did.carrier_id = carrier.carrier_id and did.did_number like concat('%', TRIM(LEADING '0' FROM  TRIM(LEADING '+' FROM '$rU'))) where ipaddress = '$si'    LIMIT 1;", "ra");
		
		xlog("L_ALERT","SELECT did.account_id, carrier.carrier_id, carrier.carrier_status, '1' AS gateway_withmedia, carrier_ips.carrier_ip_id AS enddevice_id, carrier.carrier_cps AS enddevice_cps, carrier.carrier_cc AS enddevice_cc, carrier_ips.carrier_ip_id, carrier.carrier_cps, carrier.carrier_cc from carrier INNER JOIN carrier_ips on carrier_ips.carrier_id = carrier.carrier_id  INNER JOIN did on did.carrier_id = carrier.carrier_id and did.did_number like concat('%', TRIM(LEADING '0' FROM  TRIM(LEADING '+' FROM '$rU'))) where ipaddress = '$si'   LIMIT 1;\n");
		
		$var(carrier_id)=$xavp(ra[0]=>carrier_id);	
		$var(carrier_status)=$xavp(ra[0]=>carrier_status);	
		$var(WITHMEDIA)=$xavp(ra[0]=>gateway_withmedia);
		#$var(WITHMEDIA2)=$xavp(ra[0]=>gateway_withmedia);	
			
		if($xavp(ra[0]=>carrier_id) != $null && $xavp(ra[0]=>carrier_id) != '' ){
			if($xavp(ra[0]=>account_id) == $null && $xavp(ra[0]=>account_id) == '' ){
				sl_send_reply("404","Not found..");
				exit;

			}
			append_hf("X-INCOMINGCARRIER: $xavp(ra[0]=>carrier_id)\r\n");
			append_hf("X-INCOMINGCARRIERDST: $rU\r\n");
			setflag(FLT_NATS);
			append_hf("X-WITHMEDIA: 1\r\n");			
			append_hf("X-DEVICEID: $var(DEVICEID)\r\n");		
			append_hf("X-DEVICECC: $xavp(ra[0]=>enddevice_cc)\r\n");
			append_hf("X-DEVICECPS: $xavp(ra[0]=>enddevice_cps)\r\n");			
			append_hf("X-ACCOUNTCC: $xavp(ra[0]=>enddevice_cc)\r\n");
			append_hf("X-ACCOUNTCPS: $xavp(ra[0]=>enddevice_cps)\r\n");	
			append_hf("X-DEVICEID: $xavp(ra[0]=>enddevice_id)\r\n");				
			append_hf("X-MEDIP: $si\r\n");
			remove_hf("P-Preferred-Identity");
			remove_hf("P-Asserted-Identity");			
			msg_apply_changes();
			ds_select_dst("2", "4");									
			route(RELAY);		
			exit;
		}	
	}
}
route[RELAY] {

	# enable additional event routes for forwarded requests
	# - serial forking, RTP relaying handling, a.s.o.
	if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE|INFO")) {
		if(!t_is_set("branch_route")) t_on_branch("MANAGE_BRANCH");
	}
	if (is_method("INVITE|SUBSCRIBE|UPDATE")) {
		if(!t_is_set("onreply_route")) t_on_reply("MANAGE_REPLY");
	}
	if (is_method("INVITE")) {
		if(!t_is_set("failure_route")) t_on_failure("MANAGE_FAILURE");
	}

	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}
# Per SIP request initial checks
route[REQINIT] {
	# no connect for sending replies
	set_reply_no_connect();
	# enforce symmetric signaling
	# - send back replies to the source address of request
	force_rport();

	#!ifdef WITH_FREESWITCH
        if(route(FROMFREESWITCH)){
            return;
        }
	#!endif
	if(ds_is_from_list("5")){
		return 1;
	}
		if (!is_method("INVITE|UPDATE|REGISTER")) {
		return 1;
	}
	
	if(ds_is_from_list("1")){	
		return 1;
	}
	if(ds_is_from_list("2")){
		return 1;
   	}
	if(ds_is_from_list("3")){	
		return 1;
	}
	if(ds_is_from_list("4")){
		return 1;
  	}
	if(ds_is_from_list("5")){	
		return 1;
	}
 
	sql_xquery("ca","select ipaddress from openipaddress where ipaddress = '$si' LIMIT 1;", "ra");	
	xlog("L_ALERT","select ipaddress from openipaddress where ipaddress = '$si' LIMIT 1;\n");				
	$var(ipaddress)=$xavp(ra[0]=>ipaddress);
	if($xavp(ra[0]=>ipaddress) != $null && $xavp(ra[0]=>ipaddress) != '' ){	
		return 1;
	}
 #!ifdef WITH_ANTIFLOOD
	# flood dection from same IP and traffic ban for a while
	# be sure you exclude checking trusted peers, such as pstn gateways
	# - local host excluded (e.g., loop to self)
	#!ifdef WITH_EXEC
			#Run-time IPTable
			if ($ua =~ "(VoipSwitch|Asterisk)") {
				xdbg("Callfrom UA $ua\n");
			} else if($ua =~ "(zxcvfdf11|friendly-scanner|pplsip|sipvicious|sipcli|VaxSIPUserAgent|voxalot|MizuPhone|Ozeki|tramb2017|voip|hello|Independant|Skipper)") {			
				# silent drop for scanners
				xlog("L_INFO","Blocking scanners and pushing IPs to iptables");
				exec_avp("iptables -I INPUT -s $si   -p udp -m udp --dport 5040:6000  -j DROP");
				exec_avp("/sbin/service iptables save");
				sl_send_reply("403", "Forbidden");
				exit;
			}
	#!endif	
	
	if (is_method("REGISTER")){
		if (!mf_process_maxfwd_header("10")) {
			sl_send_reply("483","Too Many Hops");
			exit;
		}
		if(!sanity_check("1511", "7")) {
			xlog("L_ALERT","Malformed SIP message from $si:$sp\n");
			send_reply("403", "Forbidden");
			exit;
		}
		return 1;
	}
	if(is_method("INVITE") || is_method("SUBSCRIBE") || is_method("REGISTER")){
	# flood detection from same IP and traffic ban for a while
		# be sure you exclude checking trusted peers, such as pstn gateways
		# - local host excluded (e.g., loop to self)
	if(src_ip!=myself)	{
	
		#!ifdef WITH_HTABLE
			if($sht(ipban=>$si)!=$null) {
				# $fu is already blocked
				xdbg("request from blocked User - $fU,  $rm from $fu (IP:$si:$sp)\n");
				if(is_method("INVITE")){
						xlog("L_ALERT"," ALERT: $fU user source IP Address $si:$sp is already blocked.\n");
				}
				send_reply("403", "Forbidden");
				exit;
			}
			if (!pike_check_req()) {
				xlog("L_ALERT","Blocking traffic from $si\n");
				xlog("L_ALERT","ALERT: pike blocking $fU, $rm from $fu  (IP:$si:$sp)\n");
				$sht(ipban=>$si) = 1;
				xlog("L_ALERT","ALERT: $fU user source IP Address $si:$sp is blocking by system.\n");
				xlog("L_INFO","ALERT: INSERT INTO `htable` (`key_name`, `key_value`, ip, htime,serverid) VALUES ('$si', '1','$si',now(),'1')\n");
				sql_xquery("ca","INSERT INTO `htable` (`key_name`, `key_value`, ip, htime,serverid) VALUES ('$si', '1','$si',now(),'1')", "ra");
				sql_xquery("ca","INSERT INTO `htabledump` (`key_name`, `key_value`, ip, htime,serverid) VALUES ('$si', '1','$si',now(),'1')", "ra");
				send_reply("403", "Forbidden");
				exit;
			}
		#!endif
		}
		if($ua =~ "friendly-scanner") {
				sl_send_reply("200", "OK");
				exit;
		}                
	}

	if(!is_method("OPTIONS") && !is_method("SUBSCRIBE") && !is_method("NOTIFY") && !is_method("INVITE")){
	# flood detection from same IP and traffic ban for a while
	# be sure you exclude checking trusted peers, such as pstn gateways
	# - local host excluded (e.g., loop to self)
		if(src_ip!=myself) {
			if($sht(userban=>$fU)!=$null) {
				# $fu is already blocked
				xdbg("request from blocked User - $fU,  $rm from $fu (IP:$si:$sp)\n");
				if(is_method("INVITE")){
					xlog("L_ALERT"," ALERT: $fU user source IP Address $si:$sp is already blocked.\n");
				}
				send_reply("403", "Forbidden");
				exit;
			}
			if (!pike_check_req()) {
				xlog("L_ALERT","ALERT: pike blocking $fU, $rm from $fu  (IP:$si:$sp)\n");
				xlog("L_ALERT","Blocking traffic from $si\n");
				$sht(userban=>$fU) = 1;

				 xlog("L_ALERT","ALERT: $fU user source IP Address $si:$sp is blocking by system.\n");
				xlog("L_INFO","ALERT: INSERT INTO `htable` (`key_name`, `key_value`, ip, htime,serverid) VALUES ('$fU', '1','$si',now(),'1')\n");
				sql_xquery("ca","INSERT INTO `htable` (`key_name`, `key_value`, ip, htime,serverid) VALUES ('$fU', '1','$si',now(),'1')", "ra");
				sql_xquery("ca","INSERT INTO `htabledump` (`key_name`, `key_value`, ip, htime,serverid) VALUES ('$fU', '1','$si',now(),'1')", "ra");
				send_reply("403", "Forbidden");
				exit;
			}
		}
		if($ua =~ "friendly-scanner") {
				sl_send_reply("200", "OK");
				exit;
		}
	}
#!endif

	if($ua =~ "friendly|scanner|sipcli|sipvicious|VaxSIPUserAgent|pplsip") {
		# silent drop for scanners - uncomment next line if want to reply
		# sl_send_reply("200", "OK");
		exit;
	}

	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}

	if(is_method("OPTIONS") && uri==myself && $rU==$null) {
		sl_send_reply("200", "Keepalive");
		exit;
	}

	if(!sanity_check("17895", "7")) {
		xlog("Malformed SIP request from $si:$sp\n");
		exit;
	}
}

# Handle requests within SIP dialogs
route[WITHINDLG] {
	if (!has_totag()) 
		return;
	
	if (has_totag()) {
		# sequential request within a dialog should
		# take the path determined by record-routing
		if (loose_route()) {
			route(DLGURI);
			if (is_method("BYE")) {
				setflag(FLT_ACC); # do accounting ...
				setflag(FLT_ACCFAILED); # ... even if the transaction fails
			} else if ( is_method("ACK") ) {
				# ACK is forwarded statelessly
				route(NATMANAGE);
			} else if ( is_method("NOTIFY") ) {
				# Add Record-Route for in-dialog NOTIFY as per RFC 6665.
				record_route();
			}
			remove_hf("X-FROMURI");
			remove_hf("X-CARRIERCPS");
			remove_hf("X-CARRIERID");
			remove_hf("X-MEDIP");
			remove_hf("X-ACCOUNTCODE");
			remove_hf("X-DEVICEID");
			remove_hf("X-DEVICECC");
			remove_hf("X-DEVICECPS");
			remove_hf("X-ACCOUNTID");
			remove_hf("X-ACCOUNTCC");
			remove_hf("X-ACCOUNTCPS");
			remove_hf("X-WITHMEDIA");
			remove_hf("X-DEVICETYPE");
			remove_hf("X-SRC-ACCOUNT");
			remove_hf("X-SRC-MED-IP");
			remove_hf("X-FS-Support");
			remove_hf("X-DSTURI");
			remove_hf("X-GMEDIA");
			remove_hf("X-RE");
			remove_hf("X-Billing-Code");
			remove_hf("X-AI");
			remove_hf("X-PU");
			remove_hf("X-MEDIATRA");
			remove_hf("X-INCOMINGCARRIER");
			remove_hf("X-INCOMINGCARRIERDST");
			remove_hf("X-DEVICEID-1");
			remove_hf("Allow-Events");
			msg_apply_changes();
			route(RELAY);
			exit;
		}

		if (is_method("SUBSCRIBE") && uri == myself) {
			# in-dialog subscribe requests
			route(PRESENCE);
			exit;
		}
		if ( is_method("ACK") ) {
			if ( t_check_trans() ) {
				# no loose-route, but stateful ACK;
				# must be an ACK after a 487
				# or e.g. 404 from upstream server
				route(RELAY);
				exit;
			} else {
				# ACK without matching transaction ... ignore and discard
				exit;
			}
		}
		sl_send_reply("404", "Not here DDD");
		exit;
	}
}

# Handle SIP registrations
route[REGISTRAR] {
	if (!is_method("REGISTER")){
		return;
	}

	if(isflagset(FLT_NATS)) {
		setbflag(FLB_NATB);
#!ifdef WITH_NATSIPPING
		# do SIP NAT pinging
		setbflag(FLB_NATSIPPING);
#!endif
	}
	sql_xquery("ca","select ipaddress, ipauthfrom, FIND_IN_SET('$si',ipaddress) state,  FIND_IN_SET('$fd',ipaddress) state2,  account_id from customer_devices where  username ='$fU';", "ra");
	xlog("L_ALERT"," REGISTRAR: select ipaddress, ipauthfrom, FIND_IN_SET('$si',ipaddress) state,  FIND_IN_SET('$fd',ipaddress) state2,  account_id from customer_devices where  username ='$fU';\n");

	xlog("L_ALERT","Registrar User name $fU $xavp(ra[0]=>ipaddress) $xavp(ra[0]=>ipauthfrom)\n");	
	#IP Restriction check	
	$var(ACCOUNTCODE)=$xavp(ra[0]=>account_id);	
	xlog("L_ALERT","ACCOUNTID $var(ACCOUNTCODE)\n");
	if($xavp(ra[0]=>ipaddress) != $null && $xavp(ra[0]=>ipaddress) != '' && $xavp(ra[0]=>ipauthfrom) != 'NO'){
		if($xavp(ra[0]=>ipaddress) != $null && $xavp(ra[0]=>ipaddress) != '' and $xavp(ra[0]=>ipauthfrom) == "SRC" && $xavp(ra[0]=>state) == '0' ){
			if($xavp(ra[0]=>ipauthfrom) != $null){
				$var(host) = $(ct{tobody.host});
				xlog("L_ALERT","Registrar User name $fU $xavp(ra[0]=>ipaddress) $xavp(ra[0]=>ipauthfrom) $fd $var(host)\n");			
				sql_result_free("ra");
				send_reply("403", "Forbidden");
				exit;		
			}else if($xavp(ra[0]=>ipaddress) != $null && $xavp(ra[0]=>ipaddress) != '' and $xavp(ra[0]=>ipauthfrom) == "FROM" && $xavp(ra[0]=>state2) == '0' ){
				if($xavp(ra[0]=>ipauthfrom) != $null){
					$var(host) = $(ct{tobody.host});
					xlog("L_ALERT","Registrar User name $fU $xavp(ra[0]=>ipaddress) $xavp(ra[0]=>ipauthfrom) $fd $var(host)\n");			
					sql_result_free("ra");
					send_reply("403", "Forbidden");
					exit;		
				}else {
					if( $xavp(ra[0]=>ipaddress) == $src_ip){
						sql_result_free("ra");
						send_reply("403", "Forbidden");
						exit;
					}
				}
			}
		}
	}

	if (!save("location","0x04")){
		sl_reply_error();
	}
	exit;
}

# User location service
route[LOCATION] {
	if(is_method("INVITE") && (!route(FROMFREESWITCH))) {	
		route(CALLS);
		exit;
	}



	remove_hf("Identity");  
	remove_hf("Allow-Events");
	remove_hf("X-FS-Support");
	remove_hf("X-FROMURI");
	remove_hf("X-CARRIERCPS");
	remove_hf("X-CARRIERID");
	remove_hf("X-MEDIP");
	remove_hf("X-ACCOUNTCODE");
	remove_hf("X-DEVICEID");
	remove_hf("X-DEVICECC");
	remove_hf("X-DEVICECPS");
	remove_hf("X-ACCOUNTID");
	remove_hf("X-ACCOUNTCC");
	remove_hf("X-ACCOUNTCPS");
	remove_hf("X-WITHMEDIA");
	remove_hf("X-DEVICETYPE");
	remove_hf("X-SRC-ACCOUNT");
	remove_hf("X-SRC-MED-IP");
	remove_hf("X-FS-Support");
	remove_hf("X-DSTURI");
	remove_hf("X-GMEDIA");
	remove_hf("X-RE");
	remove_hf("X-AI");
	remove_hf("X-PU");
	remove_hf("X-MEDIATRA");
	remove_hf("X-INCOMINGCARRIER");
	remove_hf("X-INCOMINGCARRIERDST");
	remove_hf("X-DEVICEID-1");
	remove_hf("Allow-Events");
        remove_hf("X-Billing-Code");
	msg_apply_changes();
	$avp(oexten) = $rU;
	if (!lookup("location")) {
		$var(rc) = $rc;
		route(TOVOICEMAIL);
		t_newtran();
		switch ($var(rc)) {
			case -1:
			case -3:
				send_reply("404", "Not Found");
				exit;
			case -2:
				send_reply("405", "Method Not Allowed");
				exit;
		}
	}

	# when routing via usrloc, log the missed calls also
	if (is_method("INVITE")) {
		setflag(FLT_ACCMISSED);
	}
	route(RELAY);
	exit;
}
# Presence server processing
route[PRESENCE] {
	if(!is_method("PUBLISH|SUBSCRIBE")) return;

	if(is_method("SUBSCRIBE") && $hdr(Event)=="message-summary") {
		route(TOVOICEMAIL);
		# returns here if no voicemail server is configured
		sl_send_reply("404", "No voicemail service");
		exit;
	}

#!ifdef WITH_PRESENCE
#!ifdef WITH_MSGREBUILD
	# apply changes in case the request headers or body were modified
	msg_apply_changes();
#!endif
	if (!t_newtran()) {
		sl_reply_error();
		exit;
	}

	if(is_method("PUBLISH")) {
		handle_publish();
		t_release();
	} else if(is_method("SUBSCRIBE")) {
		handle_subscribe();
		t_release();
	}
	exit;
#!endif

	# if presence enabled, this part will not be executed
	if (is_method("PUBLISH") || $rU==$null) {
		sl_send_reply("404", "Not here");
		exit;
	}
	return;
}

