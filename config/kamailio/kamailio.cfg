		xlog("L_ALERT","#### Registrar User name $fU  $xavp(ra[0]=>ipaddress) $xavp(ra[0]=>ipauthfrom) $fd $var(host)\n");

		if($xavp(ra[0]=>ipaddress) != $null && $xavp(ra[0]=>ipaddress) != '' ){
			if($xavp(ra[0]=>ipauthfrom) != $null){
				$var(host) = $(ct{tobody.host});
